<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />

  <!-- Mobile Viewport - Touch-optimized -->
  <meta name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=5, user-scalable=yes, viewport-fit=cover" />

  <!-- Theme & Status Bar -->
  <meta name="theme-color" content="#0a0e27" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <!-- PWA Support -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="SSR BOT" />

  <!-- Resource Hints — preconnect to API backend for faster first API call -->
  <link rel="dns-prefetch" href="/" />
  <link rel="preconnect" href="/" />

  <!-- Preload critical fonts for faster first paint -->
  <link rel="preload" href="/static/css/main.css" as="style" />

  <!-- Critical CSS — app shell renders before JS loads -->
  <style>
    body {
      margin: 0;
      background: #0a0e27;
      color: #e2e8f0;
      font-family: 'Inter Variable', 'Inter', -apple-system, sans-serif;
    }

    #root {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      width: 100%;
    }

    #root>* {
      width: 100%;
    }

    .app-loading {
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      min-height: 100vh;
      flex-direction: column;
      gap: 12px;
    }

    .app-loading-spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: #38bdf8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .app-loading-text {
      font-size: 14px;
      color: #64748b;
      letter-spacing: 0.5px;
    }
  </style>

  <!-- App Info -->
  <meta name="description" content="SSR BOT - Mobile Web UI Control Panel for Delta Exchange Grid Trading Bot" />
  <meta name="application-name" content="SSR BOT" />

  <title>SSR BOT - Control Panel</title>
</head>

<body>
  <noscript>You need to enable JavaScript to run this app.</noscript>
  <div id="root">
    <!-- Instant loading skeleton — visible while JS downloads & parses -->
    <div class="app-loading">
      <div class="app-loading-spinner"></div>
      <div class="app-loading-text">Loading SSR BOT...</div>
    </div>
  </div>
  <!-- Options AI Engine Panel (MAR 2026: AI-powered options intelligence) -->
  <script src="/options_ai_panel.js"></script>
</body>

</html>
