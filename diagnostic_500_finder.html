<!DOCTYPE html>
<html>
<head>
    <title>WebUI Diagnostic - Find 500 Error</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #fff; }
        .test { margin: 10px 0; padding: 10px; background: #2a2a2a; border-left: 3px solid #666; }
        .success { border-color: #4caf50; }
        .error { border-color: #f44336; }
        pre { background: #000; padding: 10px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; background: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>🔍 WebUI Diagnostic Tool</h1>
    <p>Testing all critical endpoints to find the 500 error...</p>
    
    <button onclick="runAllTests()">Run All Tests</button>
    <button onclick="clearResults()">Clear</button>
    
    <div id="results"></div>

    <script>
        const API_BASE = 'http://localhost:5555';
        const resultsDiv = document.getElementById('results');

        const endpoints = [
            { name: 'Health', url: '/api/health', method: 'GET' },
            { name: 'Config', url: '/api/config/all', method: 'GET' },
            { name: 'Bot Status', url: '/api/bot/status', method: 'GET' },
            { name: 'PM2 Status', url: '/api/pm2/status', method: 'GET' },
            { name: 'PM2 Enabled', url: '/api/pm2/enabled', method: 'GET' },
            { name: 'Symbols', url: '/api/symbols', method: 'GET' },
            { name: 'Instances', url: '/api/instances', method: 'GET' },
            { name: 'Trading Status', url: '/api/trading_status', method: 'GET' },
            { name: 'Guardian Status', url: '/api/guardian/status', method: 'GET' },
            { name: 'Positions', url: '/api/positions', method: 'GET' },
            { name: 'Orders', url: '/api/orders', method: 'GET' },
            { name: 'PnL Summary', url: '/api/pnl/summary', method: 'GET' },
            { name: 'Logs', url: '/api/logs/bot', method: 'GET' },
            { name: 'PM2 Process Details', url: '/api/pm2/process/gridbot-live', method: 'GET' },
            { name: 'PM2 Start (Test)', url: '/api/pm2/start/gridbot-demo', method: 'POST' },
        ];

        async function testEndpoint(endpoint) {
            const startTime = Date.now();
            try {
                const response = await fetch(`${API_BASE}${endpoint.url}`, {
                    method: endpoint.method,
                    headers: { 'Content-Type': 'application/json' }
                });
                
                const duration = Date.now() - startTime;
                const contentType = response.headers.get('content-type');
                let data;
                
                if (contentType && contentType.includes('application/json')) {
                    data = await response.json();
                } else {
                    data = await response.text();
                }

                return {
                    success: response.ok,
                    status: response.status,
                    statusText: response.statusText,
                    duration,
                    data,
                    contentType
                };
            } catch (error) {
                return {
                    success: false,
                    status: 0,
                    statusText: 'Network Error',
                    duration: Date.now() - startTime,
                    error: error.message
                };
            }
        }

        async function runAllTests() {
            resultsDiv.innerHTML = '<p>Running tests...</p>';
            
            for (const endpoint of endpoints) {
                const result = await testEndpoint(endpoint);
                displayResult(endpoint, result);
                await new Promise(r => setTimeout(r, 100)); // Small delay between requests
            }
        }

        function displayResult(endpoint, result) {
            const div = document.createElement('div');
            div.className = `test ${result.success ? 'success' : 'error'}`;
            
            let html = `<strong>${endpoint.method} ${endpoint.name}</strong><br>`;
            html += `Status: ${result.status} ${result.statusText} (${result.duration}ms)<br>`;
            
            if (result.status === 500) {
                html += `<span style="color: #ff5252; font-weight: bold;">⚠️ FOUND 500 ERROR!</span><br>`;
            }
            
            if (result.error) {
                html += `Error: ${result.error}<br>`;
            }
            
            if (result.data) {
                const preview = typeof result.data === 'string' 
                    ? result.data.substring(0, 200)
                    : JSON.stringify(result.data, null, 2).substring(0, 500);
                html += `<pre>${preview}${preview.length >= 200 || preview.length >= 500 ? '...' : ''}</pre>`;
            }
            
            div.innerHTML = html;
            resultsDiv.appendChild(div);
        }

        function clearResults() {
            resultsDiv.innerHTML = '';
        }

        // Auto-run on load
        setTimeout(runAllTests, 500);
    </script>
</body>
</html>
