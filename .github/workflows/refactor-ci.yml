name: Refactor Compatibility CI

on:
  push:
    branches:
      - main
      - master
      - production*
      - SSR
      - BTEH
  pull_request:
    branches:
      - main
      - master
      - BTEH
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.10"
  NODE_VERSION: "18"

jobs:
  refactor-compat:
    runs-on: ubuntu-latest
    env:
      REFACTOR_COMPAT_WARN: "12"
      REFACTOR_COMPAT_FAIL: "20"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff mypy pytest

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: webui/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: webui/frontend
        run: npm ci

      - name: Launch backend server
        run: |
          nohup python3 webui/backend/app.py > /tmp/backend.log 2>&1 &
          echo $! > backend.pid
          sleep 8

      - name: Run refactor CI script
        run: bash scripts/ci_refactor_check.sh

      - name: Summarize legacy usage
        run: |
          python3 - <<'PY'
from __future__ import annotations

import os
from pathlib import Path

from webui.backend.app import get_structured_config
from bot.refactor.compat import usage_snapshot

get_structured_config(normalize=True)
counts = usage_snapshot()
total = sum(counts.values())

lines = ["## Legacy configuration usage", "", f"- Total hits: {total}"]
for key, value in sorted(counts.items()):
    lines.append(f"- {key}: {value}")

summary_path = Path(os.environ["GITHUB_STEP_SUMMARY"])
summary_path.write_text("\n".join(lines) + "\n", encoding="utf-8")

for line in lines:
    print(line)
PY

      - name: Collect backend logs
        if: always()
        run: |
          if [ -f backend.pid ]; then
            kill "$(cat backend.pid)" 2>/dev/null || true
            sleep 2
            pkill -f "webui/backend/app.py" 2>/dev/null || true
          fi
          if [ -f /tmp/backend.log ]; then
            echo "---- Backend logs ----"
            tail -n 200 /tmp/backend.log || true
          fi

  mmm-sealed-tests:
    name: MMM Sealed Suite (deployment gate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run MMM sealed tests
        run: |
          python3 -m pytest webui/backend/routes/mmm/tests -m sealed -q \
            --tb=short --no-header \
            -p no:warnings 2>&1 | tee /tmp/mmm_sealed.log
          # Fail the job if any sealed test failed
          grep -qE "^(FAILED|ERROR)" /tmp/mmm_sealed.log && exit 1 || true

      - name: Upload sealed test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmm-sealed-test-log
          path: /tmp/mmm_sealed.log
