[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gridbot-pro"
version = "4.0.0"
requires-python = ">=3.10"
dependencies = ["python-dotenv", "requests"]

[tool.setuptools.packages.find]
include = ["bot*"]
exclude = ["tests*", "audit*", "reports*", "debugging*"]

[tool.ruff]
line-length = 200
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = []

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--ignore=webui/backend/test_analytics_persistence.py --ignore=bot/tests/test_bulk_seeding.py"
markers = [
    "sealed: contract tests for sealed functions — run before every deployment",
]

[tool.mutmut]
paths_to_mutate = "bot/strategy/modules/grid_calculator.py"
tests_dir = "/tmp/gridbot_mutation_tests/"
runner = "python3 -m pytest /tmp/gridbot_mutation_tests/test_grid_properties.py -x --tb=no -q"
