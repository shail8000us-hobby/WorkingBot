  type: object
  required: true
  description: Delta Exchange API endpoints and configuration
  properties:
    demo:
      type: object
      required: true
      properties:
        public_url:
          type: string
          required: true
          default: https://cdn-ind.testnet.deltaex.org
        
        private_url:
          type: string
          required: true
          default: https://cdn-ind.testnet.deltaex.org
        
        websocket_url:
          type: string
          required: true
          default: wss://testnet-api.delta.exchange
    
    live:
      type: object
      required: true
      properties:
        public_url:
          type: string
          required: true
          default: https://api.india.delta.exchange
        
        private_url:
          type: string
          required: true
          default: https://api.india.delta.exchange
        
        websocket_url:
          type: string
          required: true
          default: wss://socket.india.delta.exchange
    
