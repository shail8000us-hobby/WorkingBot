    demo_public_url:
      type: string
      required: false
      deprecated: true
      description: Use api.demo.public_url instead
    
    demo_private_url:
      type: string
      required: false
      deprecated: true
    
    demo_ws_url:
      type: string
      required: false
      deprecated: true
    
    live_public_url:
      type: string
      required: false
      deprecated: true
    
    live_private_url:
      type: string
      required: false
      deprecated: true
    
    live_ws_url:
      type: string
      required: false
      deprecated: true

# ═══════════════════════════════════════════════════════════════════════════
# NOTIFICATIONS
# ═══════════════════════════════════════════════════════════════════════════

notifications:
  type: object
  required: false
  description: Notification settings (Telegram, etc.)
  properties:
    enabled:
      type: boolean
      required: true
      default: true
    
    telegram:
      type: object
      required: false
      properties:
        demo:
          type: object
          required: false
          properties:
            bot_token:
              type: string
              required: false
              sensitive: true
            
            chat_id:
              type: string
              required: false
              sensitive: true
        
        live:
          type: object
          required: false
          properties:
            bot_token:
              type: string
              required: false
              sensitive: true
            
            chat_id:
              type: string
              required: false
              sensitive: true

# ═══════════════════════════════════════════════════════════════════════════
# WEB UI CONFIGURATION
# ═══════════════════════════════════════════════════════════════════════════

webui:
  type: object
  required: false
  description: Web UI server configuration
  properties:
    enabled:
      type: boolean
      required: true
      default: true
    
    port:
      type: integer
      required: true
      default: 5555
      validation:
        min: 1024
        max: 65535
    
    allowed_origins:
      type: string
      required: true
      default: http://localhost:*,http://127.0.0.1:*
    
    auth_enabled:
      type: boolean
      required: false
      default: false

# ═══════════════════════════════════════════════════════════════════════════
# RECONCILIATION
# ═══════════════════════════════════════════════════════════════════════════

reconciliation:
  type: object
  required: false
  description: Order reconciliation settings
  properties:
    enabled:
      type: boolean
      required: false
      default: true
    
    lookback_days:
      type: integer
      required: false
      default: 7
      validation:
        min: 1
        max: 90
    
    dry_run:
      type: boolean
      required: false
      default: false

# ═══════════════════════════════════════════════════════════════════════════
# EXECUTION SAFETY (Additional Layer)
# ═══════════════════════════════════════════════════════════════════════════

execution_safety:
  type: object
  required: false
  description: Additional execution safety layer
  properties:
    i_understand_live:
      type: string
      required: false
      default: 'NO'
      validation:
        values: ['YES', 'NO']
    
    execute_orders:
      type: boolean
      required: false
      default: false
    
    require_live_password:
      type: boolean
      required: false
      default: true
    
    live_trading_password:
      type: string
      required: false
      sensitive: true

