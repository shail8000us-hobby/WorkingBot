version: '6.0'
trading_mode: live

# ═══════════════════════════════════════════════════════════════════════════
# V6.0 MULTI-INSTANCE SUPPORT: Instance = Symbol + Mode
# ═══════════════════════════════════════════════════════════════════════════
# This enables running LONG and SHORT on the same symbol simultaneously.
# Each instance has its own grid, capital, and RSI thresholds.
#
# INSTANCE NAMING: SYMBOL_MODE (e.g., BTCUSD_LONG, BTCUSD_SHORT)
#
# RSI LOGIC (critical difference between LONG and SHORT):
# - LONG: stop_threshold=30 (stop when RSI <= 30, oversold = too weak to buy)
# - SHORT: stop_threshold=70 (stop when RSI >= 70, overbought = too strong to short)
# ═══════════════════════════════════════════════════════════════════════════
instances:
  BTCUSD_LONG:
    symbol: BTCUSD
    mode: LONG
    product_id: 139
    enabled: true
    capital:
      allocated_usd: 7000
      max_position_value_usd: 5000
    grid:
      geometry:
        lower: '85000'
        upper: '95000'
        step: '500'
        reference: '88500'
      limits:
        max_open_positions: '50'
        lot_size: '5'
        max_open_orders: 20
        max_qty_per_order: '2'
      behavior:
        strict_grid: 'true'
        rung_snap_mode: below
        tick_size: '0.5'
        dynamic_tick_size: 'true'
        seed_initial_count: '0'
      smart_gap_fill:
        enabled: 'false'
        order_type: maker
        max_levels: '0'
    safety:
      max_account_loss_inr: 10000
      min_liquidation_distance_pct: 10.0
      rsi:
        enabled: true
        period: 14
        stop_threshold: 30.0      # LONG: Stop when RSI <= 30 (oversold)
        resume_threshold: 40.0    # Resume when RSI >= 40
        hysteresis_seconds: 60
        timeframe: '1h'
        check_interval: 300

  BTCUSD_SHORT:
    symbol: BTCUSD
    mode: SHORT
    product_id: 139
    enabled: false               # Disabled by default, enable when ready
    capital:
      allocated_usd: 3000
      max_position_value_usd: 2000
    grid:
      geometry:
        lower: '95000'           # SHORT grid: higher prices
        upper: '105000'
        step: '500'
        reference: '100000'
      limits:
        max_open_positions: '30'
        lot_size: '5'
        max_open_orders: 15
        max_qty_per_order: '2'
      behavior:
        strict_grid: 'true'
        rung_snap_mode: above     # SHORT: snap to above
        tick_size: '0.5'
        dynamic_tick_size: 'true'
        seed_initial_count: '0'
      smart_gap_fill:
        enabled: 'false'
        order_type: maker
        max_levels: '0'
    safety:
      max_account_loss_inr: 5000
      min_liquidation_distance_pct: 10.0
      rsi:
        enabled: true
        period: 14
        stop_threshold: 70.0      # SHORT: Stop when RSI >= 70 (overbought)
        resume_threshold: 60.0    # Resume when RSI <= 60
        hysteresis_seconds: 60
        timeframe: '1h'
        check_interval: 300

  ETHUSD_LONG:
    symbol: ETHUSD
    mode: LONG
    product_id: 3136
    enabled: false               # Disabled by default
    capital:
      allocated_usd: 3000
      max_position_value_usd: 2000
    grid:
      geometry:
        lower: '3200'
        upper: '3800'
        step: '50'
        reference: '3500'
      limits:
        max_open_positions: '30'
        lot_size: '10'
        max_open_orders: 15
        max_qty_per_order: '3'
      behavior:
        strict_grid: 'true'
        tick_size: '0.05'
        rung_snap_mode: below
        dynamic_tick_size: 'false'
        seed_initial_count: '0'
      smart_gap_fill:
        enabled: 'false'
        order_type: maker
        max_levels: '0'
    safety:
      max_account_loss_inr: 5000
      min_liquidation_distance_pct: 10.0
      rsi:
        enabled: true
        period: 14
        stop_threshold: 30.0      # LONG: Stop when RSI <= 30
        resume_threshold: 40.0
        hysteresis_seconds: 60
        timeframe: '1h'
        check_interval: 300

