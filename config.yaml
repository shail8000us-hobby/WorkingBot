version: '5.0'
trading_mode: live
capital_allocation:
  total_capital_usd: 10000
  allocations:
    BTCUSD:
      capital_usd: 7000
      percentage: 70
      max_position_value_usd: 5000
    ETHUSD:
      capital_usd: 3000
      percentage: 30
      max_position_value_usd: 2000
symbols:
  BTCUSD:
    enabled: true
    product_id: 139
    mode: LONG
    capital:
      allocated_usd: 7000
      max_position_value_usd: 5000
    grid:
      geometry:
        lower: '85000'
        upper: '95000'
        step: '500'
        reference: '88500'
      limits:
        max_open_positions: '50'
        lot_size: '5'
        short_lot_size: '1'
        max_open_orders: 20
        max_qty_per_order: '2'
      behavior:
        strict_grid: 'true'
        rung_snap_mode: below
        tick_size: '0.5'
        dynamic_tick_size: 'true'
        seed_initial_count: '0'
      smart_gap_fill:
        enabled: 'false'
        order_type: maker
        max_levels: '0'
    safety:
      max_account_loss_inr: '10000'
      min_liquidation_distance_pct: 10.0
  ETHUSD:
    enabled: false
    product_id: 3136
    mode: LONG
    capital:
      allocated_usd: 3000
      max_position_value_usd: 2000
    grid:
      geometry:
        lower: '3200'
        upper: '3800'
        step: '50'
        reference: '3500'
      limits:
        max_open_positions: '30'
        lot_size: '10'
        short_lot_size: '1'
        max_open_orders: 15
        max_qty_per_order: '3'
      behavior:
        strict_grid: 'true'
        tick_size: '0.05'
        rung_snap_mode: below
        dynamic_tick_size: 'false'
        seed_initial_count: '0'
      smart_gap_fill:
        enabled: 'false'
        order_type: maker
        max_levels: '0'
    safety:
      max_account_loss_inr: '5000'
      min_liquidation_distance_pct: 10.0
capital_protection:
  equity_floor:
    floor_inr: 70000
    check_interval: 60
    require_acknowledgment: true
    enabled: true
  drawdown_cap:
    enabled: true
    max_pct: 30.0
    window_days: 30
    hysteresis_pct: 15.0
    check_interval: 3600
  two_man_rule:
    enabled: true
    timeout_seconds: 600
    auto_revert: true
  exposure_growth:
    enabled: true
    max_tranches_per_minute: 2
    max_notional_inr_per_minute: 999999999
    queue_enabled: true
  pending_budget:
    max_notional_inr: 2000000000000
    buffer_pct: 10.0
guardian:
  enabled: true
  check_interval: 5
  max_account_loss_inr: '10000'
  usd_to_inr_rate: '85.0'
  liquidation_critical: 1.0
  liquidation_warning: 5.0
  auto_close_positions: true
  health_check:
    enabled: true
    api_timeout_seconds: 30
    websocket_timeout_seconds: 60
    data_stale_threshold_seconds: 120
  close_order_type: market
  cancel_orders_on_emergency: true
  alert_threshold_80: true
  alert_threshold_90: true
  daily_summary: true
  cooldown: 60
  hysteresis_80_trigger: 80
  hysteresis_80_reset: 75
  hysteresis_90_trigger: 90
  hysteresis_90_reset: 85
  hysteresis_100_trigger: 100
  hysteresis_100_reset: 95
  health_file: .guardian_health
  pid_file: .guardian.pid
  emergency_flag: .guardian_emergency_stop
  log_file: true
  log_level: INFO
  auto_margin_topup: false
  auto_topup_amount_inr: 1000
  max_loss: 3000
safety:
  execute_orders: true
  i_understand_live: 'YES'
  live_acknowledgment: 'YES'
  max_position_size: 1000
  min_liquidation_distance_pct: 10.0
  flash_move: {}
  spread_guard: {}
  volatility:
    enabled: true
    max_iv: 55.0
    max_rv: 55.0
    max_spread: 10.0
    check_interval: 300.0
    auto_resume: true
    resume_buffer: 5.0
    monitor_enabled: true
    threshold_elevated: 40
    threshold_high: 60
    threshold_extreme: 80
    halt_threshold: 100
    rv_window: 24
    update_interval: 60
    opportunistic_recovery:
      enabled: true
      iv_threshold: 35.0
      rv_threshold: 40.0
      spread_threshold: 10.0
      max_orders_volatility: 5
      max_orders_startup: 5
      execution_delay_ms: 300
      min_profit_margin: 500
      cooldown_seconds: 60
  circuit_breaker:
    enabled: true
    failure_threshold: 3
    timeout_seconds: 60
    timeout: 60
    half_open_calls: 2
  confirmation_guard:
    enabled: true
    poll_interval: 10
    chaos_threshold: 60
  rsi:
    enabled: true
    period: 14
    overbought_threshold: 70.0
    oversold_threshold: 30.0
    long_threshold: 25
    short_threshold: 75
    hysteresis_seconds: 60
    timeframe: 1h
    check_interval: 300
    cache_ttl: 60
startup:
  sync_duration: 60
  strict_start: 'true'
  forget_exchange_on_start: 'true'
  enable_smart_recovery: 'true'
  cancel_all_on_start: 'false'
  cancel_scope: tagged
shutdown:
  shutdown_duration: 60
  cancel_buy_orders: true
  keep_tp_orders: true
order_execution:
  post_only_mode: auto
  price_buffer_pct: '0.1'
  fill_threshold: '0.98'
  max_retries: '3'
  retry_delay: '2.0'
  cooldown_seconds: '30'
  tag_prefix: GBOT_
  adopt_untagged: 'false'
heartbeat:
  enabled: 'true'
  timeout: '15'
  update_interval: '5'
  monitor_interval: '10'
  file: .heartbeat
  action: cancel_buy_orders
api:
  demo:
    public_url: https://cdn-ind.testnet.deltaex.org
    private_url: https://cdn-ind.testnet.deltaex.org
    websocket_url: wss://testnet-api.delta.exchange
    base_url: https://testnet-api.delta.exchange
    product_id: 27
    testnet: true
  live:
    public_url: https://api.india.delta.exchange
    private_url: https://api.india.delta.exchange
    websocket_url: wss://socket.india.delta.exchange
    base_url: https://api.india.delta.exchange
    product_id: 139
    testnet: false
  credentials:
    use_env: true
  reference_level: 109800
