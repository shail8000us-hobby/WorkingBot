<!DOCTYPE html>
<html>
<head>
    <title>Test Todo API</title>
</head>
<body>
    <h1>Testing Todo API from Browser</h1>
    <button onclick="testGet()">Test GET</button>
    <button onclick="testPost()">Test POST</button>
    <pre id="output"></pre>
    
    <script>
        const output = document.getElementById('output');
        
        async function testGet() {
            try {
                const res = await fetch('http://localhost:5555/api/todos');
                const data = await res.json();
                output.textContent = 'GET Response:\n' + JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = 'GET Error:\n' + err.message;
            }
        }
        
        async function testPost() {
            try {
                const res = await fetch('http://localhost:5555/api/todos', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: 'Test from browser' })
                });
                const data = await res.json();
                output.textContent = 'POST Response:\n' + JSON.stringify(data, null, 2);
            } catch (err) {
                output.textContent = 'POST Error:\n' + err.message;
            }
        }
    </script>
</body>
</html>
